name: NOC 每日盤後資料庫補給

on:
  schedule:
    # ⏰ UTC 時間 12:30 = 台灣時間 20:30（週一至週五）
    - cron: '30 12 * * 1-5'
  workflow_dispatch:  # 保留手動觸發功能

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install FinMind pandas yfinance python-dotenv tqdm
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Database Update
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python update_db.py

      - name: Commit & Push updated database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 將更新後的資料庫加入版本控制（強制加入）
          git add -f noc_warroom.db

          # 檢查是否有異動，若無則跳過提交與推送
          if git diff-index --quiet HEAD; then
            echo "📭 資料庫無變更，跳過提交"
            exit 0
          fi

          # 建立本地提交（紀錄今日更新）
          git commit -m "📦 自動更新每日戰情資料庫"

          # 🛡️ 暫存所有未提交的變更（包括未追蹤檔案）
          git stash push -u -m "stash before rebase"

          # 拉取遠端最新變更並進行變基（rebase）
          # 若發生二進制檔案（noc_warroom.db）衝突，使用 -X ours 自動保留「本機最新版本」
          git pull --rebase -X ours origin main

          # 恢復先前暫存的變更
          git stash pop || true  # 若無變更可恢復，忽略錯誤

          # 推送至遠端主分支
          git push origin main
